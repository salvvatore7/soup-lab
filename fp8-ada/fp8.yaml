base: Qwen/Qwen2.5-0.5B-Instruct
task: sft
backend: transformers

data:
  train: alpaca_tiny.jsonl
  format: alpaca
  max_length: 256

training:
  epochs: 1
  lr: 2e-5
  batch_size: 4
  gradient_accumulation_steps: 1
  quantization: none
  quantization_aware: fp8
  fp8_recipe: tensorwise
  logging_steps: 1
  save_steps: 1000
  lora:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules:
      - q_proj
      - v_proj
